      <svg viewBox="0 0 200 200">
        <circle class="ring" cx="100" cy="100" r="98" />
        <circle class="ring" cx="100" cy="100" r="74" />

      <div class="sweep"></div>
      <span class="blip" style="left:68%;top:31%;animation-delay:.72s"></span>
      <span class="blip" style="left:73%;top:66%;animation-delay:2.08s"></span>
      <span class="blip" style="left:57%;top:74%;animation-delay:2.73s"></span>
      <span class="blip" style="left:31%;top:63%;animation-delay:3.93s"></span>
      <span class="blip" style="left:39%;top:27%;animation-delay:5.57s"></span>
    </div>

            <option value="star_velocity"></option>
            <option value="stars"></option>
            <option value="created_at"></option>
